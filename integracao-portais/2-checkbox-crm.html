<!-- ==========================================================================
     Trecho para o formulário de edição de imóvel do seu CRM.
     Adiciona o checkbox "Integrar com portais" ligado ao campo integrar_portais.
     Adapte os nomes de variáveis/funções ao seu CRM (marcados com >>).
     ========================================================================== -->

<!-- 1) O HTML do checkbox (coloque perto do campo "publicar no site") -->
<label class="switch-portais">
  <input type="checkbox" id="chk-integrar-portais" aria-label="Chk integrar portais">
  <span>Integrar com portais (ZAP, VivaReal, OLX, ImovelWeb)</span>
</label>

<style>
.switch-portais{display:flex;align-items:center;gap:10px;padding:12px 14px;
  background:#f0f8fb;border:1px solid #cfe8ee;border-radius:10px;
  font-size:14px;color:#0c4a6e;cursor:pointer;margin:10px 0}
.switch-portais input{width:18px;height:18px;accent-color:#0e8a99;cursor:pointer}
</style>

<script>
// 2) Ao ABRIR um imóvel para editar, marque o checkbox conforme o valor salvo:
//    >> substitua `imovel` pela variável do imóvel carregado no seu CRM
document.getElementById('chk-integrar-portais').checked = !!imovel.integrar_portais;

// 3) Ao SALVAR o imóvel, inclua o valor do checkbox no update do Supabase:
//    >> encaixe esta linha no objeto que seu CRM já envia no update
const dadosParaSalvar = {
  // ...outros campos do seu formulário...
  integrar_portais: document.getElementById('chk-integrar-portais').checked,
};

// Exemplo de update no Supabase (adapte ao seu client/tabela):
// await supabase.from('imoveis')
//   .update(dadosParaSalvar)
//   .eq('id', imovel.id);
</script>
