<!-- ═══════════════════════════════════════════════════════════════
  SEÇÃO DE AVALIAÇÕES — colar na home (antes do rodapé) ou na página de contato.
  ⚠️ Preencha os cards com avaliações REAIS. Cada card = 1 avaliação real.
  Depois, o schema em _schema-avaliacoes.js deve refletir EXATAMENTE
  a média e a quantidade exibidas aqui.
═══════════════════════════════════════════════════════════════ -->
<style>
.aval-sec{max-width:1100px;margin:60px auto;padding:0 24px}
.aval-head{text-align:center;margin-bottom:40px}
.aval-eyebrow{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#e0b34d;font-weight:600;margin-bottom:12px}
.aval-title{font-family:'Fraunces',serif;font-weight:300;font-size:clamp(26px,4vw,40px);color:#0c4a6e;margin:0 0 10px}
.aval-title em{font-style:italic;color:#e0b34d}
.aval-resumo{display:inline-flex;align-items:center;gap:10px;background:#f0f9fa;border:1px solid #d4e8ea;border-radius:40px;padding:8px 20px;margin-top:8px}
.aval-nota{font-size:26px;font-weight:800;color:#0c4a6e}
.aval-estrelas{color:#e0b34d;font-size:18px;letter-spacing:2px}
.aval-qtd{font-size:13px;color:#5a7080}
.aval-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.aval-card{background:#fff;border:1px solid #e2e8e2;border-radius:14px;padding:22px;box-shadow:0 2px 10px rgba(12,74,110,.05)}
.aval-card-stars{color:#e0b34d;font-size:15px;letter-spacing:2px;margin-bottom:12px}
.aval-card-texto{font-size:14px;line-height:1.6;color:#3a4d5a;margin-bottom:16px}
.aval-card-autor{display:flex;align-items:center;gap:10px}
.aval-card-ini{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#0c4a6e,#0e8a99);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.aval-card-nome{font-weight:700;font-size:14px;color:#0c4a6e}
.aval-card-meta{font-size:12px;color:#8a9aa5}
.aval-cta{text-align:center;margin-top:36px}
.aval-cta a{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid #d4e8ea;color:#0c4a6e;text-decoration:none;font-weight:600;font-size:14px;padding:12px 24px;border-radius:10px;transition:.15s}
.aval-cta a:hover{background:#f0f9fa;transform:translateY(-1px)}
@media(max-width:820px){.aval-grid{grid-template-columns:1fr}}
</style>

<section class="aval-sec" id="avaliacoes">
  <div class="aval-head">
    <div class="aval-eyebrow">O que dizem nossos clientes</div>
    <h2 class="aval-title">Famílias que já realizaram o <em>sonho do litoral</em></h2>
    <!-- RESUMO: média e total — devem BATER com o schema e com os cards reais -->
    <div class="aval-resumo">
      <span class="aval-nota">5,0</span>
      <span class="aval-estrelas">★★★★★</span>
      <span class="aval-qtd">com base em <strong>0</strong> avaliações reais</span>
    </div>
  </div>

  <!-- CARDS — substitua cada um por uma avaliação REAL. Duplique conforme precisar. -->
  <div class="aval-grid">

    <!-- MODELO DE CARD (copie e preencha com dados reais):
    <div class="aval-card">
      <div class="aval-card-stars">★★★★★</div>
      <div class="aval-card-texto">"[texto real do cliente]"</div>
      <div class="aval-card-autor">
        <div class="aval-card-ini">JS</div>
        <div>
          <div class="aval-card-nome">[Nome real]</div>
          <div class="aval-card-meta">[Cidade] · [mês/ano]</div>
        </div>
      </div>
    </div>
    -->

    <div class="aval-card" style="grid-column:1/-1;text-align:center;color:#8a9aa5;font-size:14px;padding:40px">
      As avaliações reais dos clientes aparecerão aqui. Colete pelo Google Meu Negócio e pelo botão "⭐ Pedir avaliação" no CRM (ver <em>_COLETA-AVALIACOES.md</em>).
    </div>

  </div>

  <div class="aval-cta">
    <!-- Use o endereço confirmado do Google Meu Negócio quando ele estiver disponível. -->
    <a href="/contato/">⭐ Fale com nossa equipe</a>
  </div>
</section>
